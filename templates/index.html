{% extends "base.html" %}

{% block title %}Grayeye IT Asset Management System{% endblock %}

{% block content %}
<div style="max-width: 680px; margin: 40px auto; text-align: center;">
  <div class="card" style="padding: 36px 24px;">
    <h1 style="font-size: 1.8rem; font-weight: 700; color: #0f172a; margin-bottom: 12px;">
      Grayeye IT Asset Management System
    </h1>
    <p style="color: #64748b; font-size: 1rem; margin-bottom: 24px;">
      Welcome to Grayeye IT's internal enterprise asset tracking portal.
    </p>
    <div style="display: flex; justify-content: center; gap: 12px;">
      <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
      <a href="{{ url_for('asset_list') }}" class="btn btn-secondary">View Inventory</a>
    </div>
  </div>
</div>
{% endblock %}
